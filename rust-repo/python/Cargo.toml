[package]
name = "mooncake-store-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for Mooncake distributed KV-cache store (Rust implementation)"

[lib]
name = "_mooncake_store"
crate-type = ["cdylib"]

[features]
default = ["link-native"]
s3 = ["mooncake-store-client/s3"]
link-native = [
    "mooncake-store-client/link-native",
    "mooncake-p2p-store/link-native",
]

[dependencies]
mooncake-store-client = { path = "../crates/mooncake-store-client" }
mooncake-store-core = { path = "../crates/mooncake-store-core" }
mooncake-p2p-store = { path = "../crates/mooncake-p2p-store" }
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
parking_lot.workspace = true
tokio.workspace = true
uuid.workspace = true
