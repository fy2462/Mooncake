[package]
name = "mooncake-store-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for Mooncake distributed KV-cache store (Rust implementation)"

[lib]
name = "_mooncake_store"
crate-type = ["cdylib"]

[features]
default = ["link-native"]
s3 = ["mooncake-store-client/s3"]
link-native = [
    "mooncake-store-client/link-native",
    "transfer-engine-ffi/link-native",
]
link-tent-native = [
    "link-native",
    "transfer-engine-ffi/link-tent-native",
]

[dependencies]
mooncake-store-client = { path = "../crates/mooncake-store-client" }
mooncake-store-core = { path = "../crates/mooncake-store-core" }
mooncake-p2p-store = { path = "../crates/mooncake-p2p-store" }
transfer-engine-ffi = { path = "../crates/transfer-engine-ffi" }
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
parking_lot.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
