[package]
name = "mooncake-store-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mooncake_store_client"

[dependencies]
mooncake-store-core = { path = "../mooncake-store-core", features = ["transfer-engine"] }
transfer-engine-ffi = { path = "../transfer-engine-ffi" }
tonic.workspace = true
prost.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
prometheus.workspace = true
uuid.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
async-trait = "0.1"
toml = "0.8"
fs2 = "0.4"
regex = { workspace = true }
libc.workspace = true
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
bytes = { version = "1", optional = true }

[features]
default = []
cuda-host-pin = []
s3 = ["aws-sdk-s3", "aws-config", "bytes"]
link-native = [
    "mooncake-store-core/link-native",
    "transfer-engine-ffi/link-native",
]

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-build.workspace = true
