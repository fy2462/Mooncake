[package]
name = "mooncake-store-master"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mooncake-master"
path = "src/main.rs"

[lib]
name = "mooncake_store_master"

[features]
default = []
spdk-nof-probe = ["dep:spdk-io"]

[dependencies]
mooncake-store-core = { path = "../mooncake-store-core" }
tonic.workspace = true
prost.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
base64 = "0.22"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64"] }
dashmap.workspace = true
parking_lot.workspace = true
regex.workspace = true
rmp-serde.workspace = true
rmpv = "1"
zstd = "0.13"
clap.workspace = true
axum.workspace = true
etcd-client.workspace = true
redis.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
futures-util = "0.3"
aws-sdk-s3.workspace = true
aws-config.workspace = true
prometheus.workspace = true
lazy_static.workspace = true
chrono.workspace = true
thiserror.workspace = true
rand.workspace = true
libc.workspace = true
spdk-io = { version = "0.1.0", optional = true }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", features = ["aws_lc_rs"] }

[build-dependencies]
tonic-build.workspace = true
