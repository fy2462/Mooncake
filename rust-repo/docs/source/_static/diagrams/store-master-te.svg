<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Rust Store、Master 与 Transfer Engine 代码边界</title>
  <desc id="desc">Rust crate、安全 FFI、C ABI、C++ Transfer Engine 和 RDMA transport 的依赖边界。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><style>.title{font:700 28px sans-serif;fill:#0f172a}.group{font:700 18px sans-serif;fill:#0f172a}.head{font:700 16px sans-serif;fill:#0f172a}.body{font:14px sans-serif;fill:#334155}.edge{fill:none;stroke-width:3;marker-end:url(#arrow)}.box{stroke-width:2}</style></defs>
  <rect width="1400" height="820" fill="#fff"/><text x="700" y="42" text-anchor="middle" class="title">Rust Store / Master / TE 代码与 ABI 边界</text>
  <rect x="45" y="75" width="770" height="620" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="75" y="110" class="group">Rust 安全域</text>
  <rect x="855" y="75" width="500" height="620" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="885" y="110" class="group">Native C++ 域</text>
  <g><rect class="box" x="90" y="150" width="220" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="200" y="182" text-anchor="middle" class="head">mooncake-store-core</text><text x="200" y="207" text-anchor="middle" class="body">Segment / Replica / Config</text></g>
  <g><rect class="box" x="390" y="150" width="260" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="520" y="182" text-anchor="middle" class="head">mooncake-store-client</text><text x="520" y="207" text-anchor="middle" class="body">Put / Get / Remove / cache</text></g>
  <g><rect class="box" x="90" y="300" width="270" height="90" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="225" y="335" text-anchor="middle" class="head">mooncake-store-master</text><text x="225" y="362" text-anchor="middle" class="body">tonic service / allocator / HA</text></g>
  <g><rect class="box" x="450" y="300" width="300" height="90" rx="10" fill="#ffedd5" stroke="#c2410c"/><text x="600" y="335" text-anchor="middle" class="head">transfer-engine-ffi</text><text x="600" y="362" text-anchor="middle" class="body">NonNull handle / RAII / error map</text></g>
  <g><rect class="box" x="450" y="465" width="300" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="600" y="497" text-anchor="middle" class="head">unsafe 边界</text><text x="600" y="522" text-anchor="middle" class="body">raw pointer + caller lifetime contract</text></g>
  <g><rect class="box" x="90" y="465" width="270" height="80" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="225" y="497" text-anchor="middle" class="head">Protobuf / tonic gRPC</text><text x="225" y="522" text-anchor="middle" class="body">控制面</text></g>
  <g><rect class="box" x="930" y="150" width="350" height="80" rx="10" fill="#ffedd5" stroke="#c2410c"/><text x="1105" y="182" text-anchor="middle" class="head">C ABI</text><text x="1105" y="207" text-anchor="middle" class="body">transfer_engine_c.h / bindgen</text></g>
  <g><rect class="box" x="930" y="290" width="350" height="90" rx="10" fill="#fed7aa" stroke="#c2410c"/><text x="1105" y="325" text-anchor="middle" class="head">C++ TransferEngine / TENT</text><text x="1105" y="352" text-anchor="middle" class="body">metadata · batch · transport dispatch</text></g>
  <g><rect class="box" x="930" y="440" width="350" height="80" rx="10" fill="#fef3c7" stroke="#a16207"/><text x="1105" y="472" text-anchor="middle" class="head">Transports</text><text x="1105" y="497" text-anchor="middle" class="body">RDMA / TCP / SHM / NoF</text></g>
  <g><rect class="box" x="930" y="580" width="350" height="65" rx="10" fill="#fefce8" stroke="#a16207"/><text x="1105" y="620" text-anchor="middle" class="head">RNIC · registered memory · QP · CQ</text></g>
  <path class="edge" d="M390 190 H310" stroke="#1d4ed8"/><path class="edge" d="M225 300 V230" stroke="#15803d"/>
  <path class="edge" d="M470 230 L360 465" stroke="#15803d"/><text x="375" y="345" class="body">gRPC</text><path class="edge" d="M360 505 L225 390" stroke="#15803d"/>
  <path class="edge" d="M560 230 L590 300" stroke="#c2410c"/><text x="600" y="268" class="body">安全 API</text><path class="edge" d="M600 390 V465" stroke="#b91c1c"/>
  <path class="edge" d="M750 505 H840 V190 H930" stroke="#c2410c"/><text x="815" y="480" class="body">bindgen</text><path class="edge" d="M1105 230 V290" stroke="#c2410c"/><path class="edge" d="M1105 380 V440" stroke="#a16207"/><path class="edge" d="M1105 520 V580" stroke="#a16207"/>
  <g><rect class="box" x="455" y="735" width="490" height="55" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-dasharray="8 5"/><text x="700" y="769" text-anchor="middle" class="head">C++ Store：不编译、不链接、不调用</text></g>
</svg>
