name: mc-rdma

x-rdma-node: &rdma-node
  image: ${RDMA_IMAGE:-mc-rdma-runtime:latest}
  privileged: true
  cap_add: [NET_ADMIN, SYS_ADMIN, IPC_LOCK]
  ulimits:
    memlock: {soft: -1, hard: -1}
  volumes:
    - ${RDMA_ARTIFACT_ROOT:-/home/fy2462/workspace/tmp/mooncake/rdma-multinode}:/artifacts
    - ${RDMA_ARTIFACT_ROOT:-/home/fy2462/workspace/tmp/mooncake/rdma-multinode}/runtime:/opt/mooncake-rdma:ro
    - /dev/infiniband:/dev/infiniband
  environment:
    PYTHONPATH: /opt/mooncake-rdma/store
    LD_LIBRARY_PATH: /opt/mooncake-rdma/te
    MC_GID_INDEX: ${RDMA_GID_INDEX:-0}
  command: [sleep, infinity]
  network_mode: host

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: mc-rdma-etcd
    network_mode: host
    command:
      - etcd
      - --data-dir=/tmp/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    healthcheck:
      test: [CMD, etcdctl, endpoint, health, --endpoints=http://127.0.0.1:2379]
      interval: 2s
      timeout: 2s
      retries: 15

  te-node-a:
    <<: *rdma-node
    container_name: mc-rdma-te-node-a

  te-node-b:
    <<: *rdma-node
    container_name: mc-rdma-te-node-b

  te-node-c:
    <<: *rdma-node
    container_name: mc-rdma-te-node-c

  rust-master:
    <<: *rdma-node
    container_name: mc-rdma-rust-master

  store-node-a:
    <<: *rdma-node
    container_name: mc-rdma-store-node-a

  store-node-b:
    <<: *rdma-node
    container_name: mc-rdma-store-node-b

  store-node-c:
    <<: *rdma-node
    container_name: mc-rdma-store-node-c

  store-test-client:
    <<: *rdma-node
    container_name: mc-rdma-store-test-client
