syntax = "proto3";

package mooncake.store;

enum ClientStatus {
  CLIENT_STATUS_UNDEFINED = 0;
  CLIENT_STATUS_OK = 1;
  CLIENT_STATUS_NEED_REMOUNT = 2;
}

enum ObjectDataType {
  OBJECT_DATA_TYPE_UNKNOWN = 0;
  OBJECT_DATA_TYPE_KVCACHE = 1;
  OBJECT_DATA_TYPE_TENSOR = 2;
  OBJECT_DATA_TYPE_WEIGHT = 3;
  OBJECT_DATA_TYPE_SAMPLE = 4;
  OBJECT_DATA_TYPE_ACTIVATION = 5;
  OBJECT_DATA_TYPE_GRADIENT = 6;
  OBJECT_DATA_TYPE_OPTIMIZER_STATE = 7;
  OBJECT_DATA_TYPE_METADATA = 8;
  OBJECT_DATA_TYPE_GENERAL = 9;
}

// ---------------------------------------------------------------
// Common types
// ---------------------------------------------------------------

message Uuid {
  fixed64 high = 1;
  fixed64 low = 2;
}

message ReplicaDescriptor {
  enum ReplicaStatus {
    UNDEFINED = 0;
    ALLOCATING = 1;
    WRITTEN = 2;
    COMPLETE = 3;
    FAILED = 4;
  }

  enum ReplicaType {
    MEMORY = 0;
    DISK = 1;
    LOCAL_DISK = 2;
    NOF_SSD = 3;
    ALL = 4;
  }

  Uuid segment_id = 1;
  string segment_name = 2;
  bytes slice_key_hash = 3;
  uint64 offset = 4;
  ReplicaStatus status = 5;
  ReplicaType replica_type = 6;
  uint64 size = 7;
  Uuid holder_client_id = 8;
  string transport_endpoint = 9;
  string file_path = 10;
  uint64 object_size = 11;
  Uuid local_disk_client_id = 12;
}

message ReplicateConfig {
  uint32 replica_num = 1;
  uint32 nof_replica_num = 2;
  bool with_soft_pin = 3;
  bool with_hard_pin = 4;
  string preferred_segment = 5;
  bool prefer_alloc_in_same_node = 6;
  repeated string preferred_segments = 7;
  repeated string preferred_nof_segments = 8;
  ObjectDataType data_type = 9;
}

message NoFSegment {
  Uuid id = 1;
  string name = 2;
  uint64 base = 3;
  uint64 size = 4;
  string te_endpoint = 5;
  Uuid client_id = 6;
}

message NoFSegmentOwnerInfo {
  Uuid segment_id = 1;
  Uuid client_id = 2;
}

// ---------------------------------------------------------------
// Ping
// ---------------------------------------------------------------

message PingRequest {
  Uuid client_id = 1;
  repeated string mounted_segments = 2;
}

message PingResponse {
  int64 view_version_id = 1;
  ClientStatus client_status = 2;
}

// ---------------------------------------------------------------
// Mount / Unmount
// ---------------------------------------------------------------

message MountSegmentRequest {
  Uuid client_id = 1;
  string segment_name = 2;
  uint64 size = 3;
}

message MountSegmentResponse {}

message MountNoFSegmentRequest {
  Uuid client_id = 1;
  NoFSegment segment = 2;
}

message MountNoFSegmentResponse {}

message UnmountSegmentRequest {
  Uuid segment_id = 1;
  Uuid client_id = 2;
}

message UnmountSegmentResponse {}

message UnmountNoFSegmentRequest {
  Uuid segment_id = 1;
  Uuid client_id = 2;
}

message UnmountNoFSegmentResponse {}

message GracefulUnmountSegmentRequest {
  Uuid segment_id = 1;
  Uuid client_id = 2;
  uint64 grace_period_ms = 3;
}

message GracefulUnmountSegmentResponse {}

message ReMountSegmentRequest {
  Uuid client_id = 1;
  repeated string segment_names = 2;
  repeated uint64 segment_sizes = 3;
}

message ReMountSegmentResponse {}

message ReMountNoFSegmentRequest {
  Uuid client_id = 1;
  repeated NoFSegment segments = 2;
}

message ReMountNoFSegmentResponse {}

message MountLocalDiskSegmentRequest {
  Uuid client_id = 1;
  bool enable_offloading = 2;
}

message MountLocalDiskSegmentResponse {}

message OffloadObjectHeartbeatRequest {
  Uuid client_id = 1;
  bool enable_offloading = 2;
}

message OffloadObjectHeartbeatResponse {
  map<string, int64> objects = 1;
}

message ReportSsdCapacityRequest {
  Uuid client_id = 1;
  int64 ssd_total_capacity_bytes = 2;
}

message ReportSsdCapacityResponse {}

message StorageObjectMetadata {
  int64 bucket_id = 1;
  int64 offset = 2;
  int64 key_size = 3;
  int64 data_size = 4;
  string transport_endpoint = 5;
}

message NotifyOffloadSuccessRequest {
  Uuid client_id = 1;
  repeated string keys = 2;
  repeated StorageObjectMetadata metadatas = 3;
}

message NotifyOffloadSuccessResponse {}

message PromotionObjectHeartbeatRequest {
  Uuid client_id = 1;
}

message PromotionObjectHeartbeatResponse {
  map<string, int64> objects = 1;
}

message PromotionAllocStartRequest {
  Uuid client_id = 1;
  string key = 2;
  uint64 size = 3;
  repeated string preferred_segments = 4;
}

message PromotionAllocStartResponse {
  ReplicaDescriptor memory_descriptor = 1;
}

message NotifyPromotionSuccessRequest {
  Uuid client_id = 1;
  string key = 2;
}

message NotifyPromotionSuccessResponse {}

message NotifyPromotionFailureRequest {
  Uuid client_id = 1;
  string key = 2;
}

message NotifyPromotionFailureResponse {}

// ---------------------------------------------------------------
// Key existence
// ---------------------------------------------------------------

message ExistKeyRequest {
  string key = 1;
}

message ExistKeyResponse {
  bool exists = 1;
}

message BatchExistKeyRequest {
  repeated string keys = 1;
}

message BatchExistKeyResponse {
  repeated bool results = 1;
}

// ---------------------------------------------------------------
// Keys / Segments enumeration
// ---------------------------------------------------------------

message GetAllKeysRequest {}

message GetAllKeysResponse {
  repeated string keys = 1;
}

message GetAllSegmentsRequest {}

message GetAllSegmentsResponse {
  repeated string segments = 1;
}

message GetAllNoFSegmentsRequest {}

message GetAllNoFSegmentsResponse {
  repeated NoFSegment segments = 1;
}

message GetNoFSegmentsByNameRequest {
  string segment_name = 1;
}

message GetNoFSegmentsByNameResponse {
  repeated NoFSegmentOwnerInfo owners = 1;
}

// ---------------------------------------------------------------
// Put workflow
// ---------------------------------------------------------------

message PutStartRequest {
  Uuid client_id = 1;
  string key = 2;
  uint64 slice_length = 3;
  ReplicateConfig config = 4;
}

message PutStartResponse {
  repeated ReplicaDescriptor replicas = 1;
}

message PutEndRequest {
  Uuid client_id = 1;
  string key = 2;
  ReplicaDescriptor.ReplicaType replica_type = 3;
}

message PutEndResponse {}

message PutRevokeRequest {
  Uuid client_id = 1;
  string key = 2;
  ReplicaDescriptor.ReplicaType replica_type = 3;
}

message PutRevokeResponse {}

message BatchPutEndRequest {
  repeated PutEndEntry entries = 1;
}

message PutEndEntry {
  Uuid client_id = 1;
  string key = 2;
  ReplicaDescriptor.ReplicaType replica_type = 3;
}

message BatchPutEndResponse {
  repeated int32 statuses = 1; // 0 = ok, non-zero = error code
}

message BatchPutRevokeRequest {
  repeated string keys = 1;
  Uuid client_id = 2;
  string segment_name = 3;
}

message BatchPutRevokeResponse {
  repeated int32 statuses = 1;
}

message BatchRemoveRequest {
  repeated string keys = 1;
  bool force = 2;
}

message BatchRemoveResponse {
  repeated int32 statuses = 1;
}

message BatchUpsertEndRequest {
  repeated UpsertEntry entries = 1;
}

message UpsertEntry {
  Uuid client_id = 1;
  string key = 2;
  uint64 slice_length = 3;
  ReplicateConfig config = 4;
}

message BatchUpsertEndResponse {
  repeated ReplicaDescriptor replicas = 1;
}

message AddReplicaRequest {
  Uuid client_id = 1;
  string key = 2;
  ReplicaDescriptor replica = 3;
}

message AddReplicaResponse {}

// ---------------------------------------------------------------
// Get
// ---------------------------------------------------------------

message GetReplicaListRequest {
  string key = 1;
}

message GetReplicaListResponse {
  repeated ReplicaDescriptor replicas = 1;
  uint64 lease_ttl_ms = 2;
}

// ---------------------------------------------------------------
// Remove
// ---------------------------------------------------------------

message RemoveRequest {
  string key = 1;
  bool force = 2;
}

message RemoveResponse {}

message RemoveByRegexRequest {
  string pattern = 1;
  bool force = 2;
}

message RemoveByRegexResponse {
  int64 removed_count = 1;
}

message RemoveAllRequest {
  bool force = 1;
}

message RemoveAllResponse {
  int64 removed_count = 1;
}

// ---------------------------------------------------------------
// Batch queries
// ---------------------------------------------------------------

message BatchQueryIpRequest {
  repeated Uuid client_ids = 1;
}

message BatchQueryIpResponse {
  map<string, IpList> ips = 1;
}

message IpList {
  repeated string addresses = 1;
}

message BatchReplicaClearRequest {
  repeated string object_keys = 1;
  Uuid client_id = 2;
  string segment_name = 3;
}

message BatchReplicaClearResponse {
  repeated string cleared_keys = 1;
}

message QueryByRegexRequest {
  string pattern = 1;
}

message QueryByRegexResponse {
  message Entry {
    string key = 1;
    repeated ReplicaDescriptor replicas = 2;
  }
  repeated Entry entries = 1;
}

// ---------------------------------------------------------------
// Segment queries
// ---------------------------------------------------------------

message QuerySegmentsRequest {
  string segment_name = 1;
}

message QuerySegmentsResponse {
  uint64 total_size = 1;
  uint64 used_size = 2;
}

message QueryIpRequest {
  Uuid client_id = 1;
}

message QueryIpResponse {
  repeated string addresses = 1;
}

message GetStorageConfigRequest {}

message GetStorageConfigResponse {
  string fs_dir = 1;
  bool enable_disk_eviction = 2;
  uint64 quota_bytes = 3;
}

// ---------------------------------------------------------------
// Upsert
// ---------------------------------------------------------------

message UpsertRequest {
  Uuid client_id = 1;
  string key = 2;
  uint64 slice_length = 3;
  ReplicateConfig config = 4;
}

message UpsertResponse {
  repeated ReplicaDescriptor replicas = 1;
}

message CopyStartRequest {
  Uuid client_id = 1;
  string key = 2;
  string source = 3;
  repeated string targets = 4;
}

message CopyStartResponse {
  ReplicaDescriptor source = 1;
  repeated ReplicaDescriptor targets = 2;
}

message CopyEndRequest {
  Uuid client_id = 1;
  string key = 2;
}

message CopyEndResponse {}

message CopyRevokeRequest {
  Uuid client_id = 1;
  string key = 2;
}

message CopyRevokeResponse {}

message MoveStartRequest {
  Uuid client_id = 1;
  string key = 2;
  string source = 3;
  string target = 4;
}

message MoveStartResponse {
  ReplicaDescriptor source = 1;
  ReplicaDescriptor target = 2;
}

message MoveEndRequest {
  Uuid client_id = 1;
  string key = 2;
}

message MoveEndResponse {}

message MoveRevokeRequest {
  Uuid client_id = 1;
  string key = 2;
}

message MoveRevokeResponse {}

// ---------------------------------------------------------------
// Task management
// ---------------------------------------------------------------

message CreateCopyTaskRequest {
  string key = 1;
  repeated string targets = 2;
}

message CreateCopyTaskResponse {
  Uuid task_id = 1;
}

message CreateMoveTaskRequest {
  string key = 1;
  string source = 2;
  string target = 3;
}

message CreateMoveTaskResponse {
  Uuid task_id = 1;
}

enum TaskType {
  REPLICA_COPY = 0;
  REPLICA_MOVE = 1;
}

enum TaskStatus {
  TASK_PENDING = 0;
  TASK_PROCESSING = 1;
  TASK_SUCCESS = 2;
  TASK_FAILED = 3;
}

message QueryTaskRequest {
  Uuid task_id = 1;
}

message QueryTaskResponse {
  Uuid id = 1;
  TaskType task_type = 2;
  TaskStatus status = 3;
  int64 created_at_ms_epoch = 4;
  int64 last_updated_at_ms_epoch = 5;
  Uuid assigned_client = 6;
  string message = 7;
}

message TaskAssignment {
  Uuid id = 1;
  TaskType type = 2;
  string payload = 3;
  int64 created_at_ms_epoch = 4;
  uint32 max_retry_attempts = 5;
}

message FetchTasksRequest {
  Uuid client_id = 1;
  uint32 batch_size = 2;
}

message FetchTasksResponse {
  repeated TaskAssignment tasks = 1;
}

message TaskCompleteRequest {
  Uuid id = 1;
  TaskStatus status = 2;
  string message = 3;
}

message MarkTaskToCompleteRequest {
  Uuid client_id = 1;
  TaskCompleteRequest request = 2;
}

message MarkTaskToCompleteResponse {}

// ---------------------------------------------------------------
// Batch PutStart
// ---------------------------------------------------------------

message BatchPutStartRequest {
  Uuid client_id = 1;
  repeated string keys = 2;
  repeated uint64 slice_lengths = 3;
  ReplicateConfig config = 4;
}

message BatchPutStartResponse {
  repeated ReplicaDescriptor replicas = 1;
}

// ---------------------------------------------------------------
// Evict disk replica
// ---------------------------------------------------------------

message EvictDiskReplicaRequest {
  Uuid client_id = 1;
  string key = 2;
  ReplicaDescriptor.ReplicaType replica_type = 3;
}

message EvictDiskReplicaResponse {}

message BatchEvictDiskReplicaRequest {
  Uuid client_id = 1;
  repeated string keys = 2;
  ReplicaDescriptor.ReplicaType replica_type = 3;
}

message BatchEvictDiskReplicaResponse {}

// ---------------------------------------------------------------
// Segment status
// ---------------------------------------------------------------

enum SegmentStatus {
  SEGMENT_STATUS_UNDEFINED = 0;
  SEGMENT_STATUS_ACTIVE = 1;
  SEGMENT_STATUS_DRAINING = 2;
  SEGMENT_STATUS_UNAVAILABLE = 3;
}

message QuerySegmentStatusRequest {
  string segment_name = 1;
}

message QuerySegmentStatusResponse {
  SegmentStatus status = 1;
}

message QuerySegmentStatusByIdRequest {
  Uuid segment_id = 1;
}

message QuerySegmentStatusByIdResponse {
  SegmentStatus status = 1;
}

// ---------------------------------------------------------------
// Drain job
// ---------------------------------------------------------------

message CreateDrainJobRequest {
  repeated string segments = 1;
  repeated string target_segments = 2;
  uint32 max_concurrency = 3;
}

message CreateDrainJobResponse {
  Uuid job_id = 1;
}

enum JobType {
  JOB_TYPE_DRAIN = 0;
}

enum JobStatus {
  JOB_STATUS_CREATED = 0;
  JOB_STATUS_PLANNING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELED = 5;
}

message QueryDrainJobRequest {
  Uuid job_id = 1;
}

message QueryDrainJobResponse {
  Uuid id = 1;
  JobType type = 2;
  JobStatus status = 3;
  int64 created_at_ms_epoch = 4;
  int64 last_updated_at_ms_epoch = 5;
  repeated string segments = 6;
  uint64 succeeded_units = 7;
  uint64 failed_units = 8;
  uint64 blocked_units = 9;
  uint64 active_units = 10;
  uint64 migrated_bytes = 11;
  string message = 12;
}

message CancelDrainJobRequest {
  Uuid job_id = 1;
}

message CancelDrainJobResponse {}

// ---------------------------------------------------------------
// Get FS dir (HA support)
// ---------------------------------------------------------------

message GetFsdirRequest {}

message GetFsdirResponse {
  string fs_dir = 1;
}
